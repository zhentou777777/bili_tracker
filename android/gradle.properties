org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=true
# 让 Gradle 信任 Windows 系统证书库（部分网络环境下 Java 自带证书库会校验失败）
systemProp.javax.net.ssl.trustStoreType=WINDOWS-ROOT
# 关闭 Kotlin 增量编译。
# 原因：本机 pub 缓存在 C 盘（C:\Users\...\AppData\Local\Pub\Cache），
# 而项目在 D 盘；Kotlin 增量编译需要把源码路径换算成相对路径，跨盘符做不到，
# 于是每个插件模块编译结束、回写增量缓存时都会抛：
#   Could not close incremental caches in ...\caches-jvm\jvm\kotlin
#   java.lang.IllegalArgumentException: this and base files have different
#   roots: C:\...\Pub\Cache\... and D:\fan club\bili_tracker\android
# 该错误不致命（Kotlin 会自动退回全量编译，APK 照样产出），但会在
# BUILD_APK.bat 窗口里刷出几百行 Java 堆栈，看起来像构建失败。
# 关掉增量编译后日志干净，且因为本来就会退回全量，实际速度没有损失。
kotlin.incremental=false
