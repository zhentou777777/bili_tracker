name: bili_tracker
description: 追更台 —— 把关注的 B 站 UP 主动态与开播聚到一处。仅 Android。
publish_to: "none"
version: 0.2.0+1

# 版本下限必须写实。原先写的是 sdk >=3.0.0 / flutter >=3.10.0，
# 但代码实际用了 Color.withValues（Flutter 3.27+）、CardThemeData / DialogThemeData
# （更晚才有），且 workmanager 0.9.x 本身就强制 Flutter >= 3.32。
# 下限写太低不会更兼容，只会让 Flutter 3.10~3.31 通过 pub get 的版本检查、
# 然后在编译期报一堆看不懂的缺符号错误。当前实况：Flutter 3.32.8 / Dart 3.8.1。
environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

  # 网络（WBI 签名用的 MD5 自带实现，见 lib/core/md5.dart，不引第三方）
  dio: ^5.4.0

  # 安全存储：Cookie 落 Keystore / Keychain，永不上传
  flutter_secure_storage: ^9.0.0

  # 登录 WebView：需要读取 HttpOnly 的 SESSDATA，
  # webview_flutter 官方只有 set/clear、没有读取 API，因此用 inappwebview 的 CookieManager
  flutter_inappwebview: ^6.1.0

  # Cookie jar：自动维护 buvid3 等设备指纹，缺失会触发 -352 风控
  dio_cookie_manager: ^3.1.0
  cookie_jar: ^4.0.8

  # 本地数据库：手写 SQL，无代码生成步骤，clone 下来即可编译
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  path: ^1.9.0

  # 本地通知
  flutter_local_notifications: ^17.2.2

  # 后台任务
  workmanager: ^0.9.0

  # 配置 / 工具
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.0

  # 扫码登录要渲染二维码。选它的理由：纯 Dart 实现（只依赖 qr 包），
  # **不含任何原生代码**，不会给 Gradle/NDK 引入构建风险 ——
  # 与当初把 workmanager 换掉是同一套判断标准。
  # 默认前景色写死为纯黑（PrettyQrSmoothSymbol.color = 0xFF000000），
  # 不受本项目深色主题影响，配白底卡片即可扫。
  pretty_qr_code: ^3.6.0

# workmanager 0.9.x 官方打包缺陷：
# interface 0.9.4 给 registerOneOffTask/registerPeriodicTask 加了 foregroundServiceConfig 参数，
# 但 apple 0.9.4 的覆写未同步（缺该参数），任何项目解析到 interface 0.9.4 都会编译失败。
# 钉回 android 0.9.2 + interface 0.9.3（apple 0.9.4 的覆写与之完全匹配，已逐签名核对）。
# 注：不能升 workmanager 0.10.x —— 其要求 Flutter >=3.38，本项目锁定 3.32.8。
dependency_overrides:
  workmanager_platform_interface: 0.9.3
  workmanager_android: 0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/rules/
